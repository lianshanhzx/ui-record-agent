<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>scan-modal-fixture</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 16px; }
  .el-form-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .el-form-item__label { width: 110px; }
  .el-dialog { position: absolute; top: 40px; left: 40px; width: 480px; border: 1px solid #888; background: #fff; padding: 12px; }
  .el-dialog__title { font-weight: bold; margin-bottom: 8px; display: block; }
</style>
</head>
<body>
<!-- 页面上的「客户名称」：与弹窗内同标签，用于验证作用域前缀是否生效 -->
<form class="el-form">
  <div class="el-form-item">
    <label class="el-form-item__label">客户名称</label>
    <div class="el-form-item__content"><input placeholder="页面-请输入"></div>
  </div>
</form>

<div class="el-dialog">
  <span class="el-dialog__title">客户信息</span>
  <div class="el-form-item">
    <label class="el-form-item__label">客户名称</label>
    <div class="el-form-item__content"><input placeholder="弹窗-请输入"></div>
  </div>
  <div class="el-form-item">
    <label class="el-form-item__label">手机号</label>
    <div class="el-form-item__content"><input placeholder="弹窗-请输入"></div>
  </div>
  <button>确定</button>
</div>
</body>
</html>
